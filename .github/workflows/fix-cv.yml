name: Fix CV
on:
  push:
    paths:
      - 'fix_cv.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix CV visibility
        run: python3 fix_cv.py
      - name: Commit and cleanup
        run: |
          rm -f fix_cv.py
          rm -f .github/workflows/fix-cv.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Fix CV/about content hidden by GSAP scroll animation" || echo "nothing to commit"
          git push
