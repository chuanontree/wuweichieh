name: Batch4
on:
  push:
    paths:
      - 'batch4.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply deep batch 4
        run: python3 batch4.py
      - name: Commit and cleanup
        run: |
          rm -f batch4.py
          rm -f .github/workflows/batch4.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Deep batch 4: luxury/apple/bauhaus about+cv layouts & interactions" || echo "nothing to commit"
          git push
