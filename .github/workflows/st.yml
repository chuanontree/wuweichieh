name: STThemes
on:
  push:
    paths:
      - 'st.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply circuit/garden + dropdown
        run: python3 st.py
      - name: Commit and cleanup
        run: |
          rm -f st.py
          rm -f .github/workflows/st.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Add S circuit + T garden themes (full + 3D + interactions); switcher to Style dropdown" || echo "nothing to commit"
          git push
