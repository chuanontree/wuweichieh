name: CW2
on:
  push:
    paths:
      - 'cw2.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Enrich chinese works handscroll
        run: python3 cw2.py
      - name: Commit and cleanup
        run: |
          rm -f cw2.py
          rm -f .github/workflows/cw2.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Enrich chinese works: parallax mountains, silk mounting, scroll panels" || echo "nothing to commit"
          git push
