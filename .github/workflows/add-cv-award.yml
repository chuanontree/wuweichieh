name: Add CV award 2026
on:
  push:
    paths:
      - '.github/workflows/add-cv-award.yml'
  workflow_dispatch: {}
jobs:
  edit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert award row
        run: |
          python3 - <<'PY'
          with open('index.html', encoding='utf-8') as f:
              html = f.read()
          anchor = '<div class="er"><span class="en">回返 設計聯展 (系統:不在此處)</span><span class="et">Exhibition · 桃園高中展藝中心 · 2026</span></div>'
          if anchor not in html:
              raise SystemExit('CV anchor not found')
          row = '\n        <div class="er"><span class="en">明維藝新獎第二屆 銅獎</span><span class="et">Award · 2026</span></div>'
          if '明維藝新獎' in html:
              print('award already present; skipping')
          else:
              html = html.replace(anchor, anchor + row)
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(html)
              print('Inserted award row')
          PY
      - name: Commit
        run: |
          rm -f "$GITHUB_WORKSPACE/.github/workflows/add-cv-award.yml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add 2026 award to CV" || { echo 'nothing to commit'; exit 0; }
          git push
