name: Fix Meta HTML
on:
  push:
    paths:
      - 'fix_meta_html.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply fix
        run: python3 fix_meta_html.py
      - name: Commit and cleanup
        run: |
          rm -f fix_meta_html.py
          rm -f .github/workflows/fix-meta-html.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Fix: all themes use innerHTML for meta (preserve line breaks)" || echo "nothing to commit"
          git push
