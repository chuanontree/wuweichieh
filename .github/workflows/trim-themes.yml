name: Trim Themes
on:
  push:
    paths:
      - 'trim_themes.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply
        run: python3 trim_themes.py
      - name: Commit and cleanup
        run: |
          rm -f trim_themes.py
          rm -f .github/workflows/trim-themes.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Remove themes A B E F J-T; keep Original + C D G H I" || echo "nothing to commit"
          git push
