name: Add PQR Themes
on:
  push:
    paths:
      - 'addthemes2.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Sky/Crystal/Y2K themes
        run: python3 addthemes2.py
      - name: Commit and cleanup
        run: |
          rm -f addthemes2.py
          rm -f .github/workflows/add-themes-pqr.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Add themes P/Q/R (Sky/Crystal/Y2K Liquid Chrome) + 3D models" || echo "nothing to commit"
          git push
