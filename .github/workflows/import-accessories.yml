name: Import accessories from Drive
on:
  push:
    paths:
      - '.github/workflows/import-accessories.yml'
  workflow_dispatch: {}
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Pillow
        run: pip install Pillow
      - name: Download images
        run: |
          set -e
          mkdir -p assets/acc raw
          ids=(\
            "1fowvfU2w8qAVJhU2NagMLV9s1BepB_7B" \
            "14DxlUsPKHpOeH7ZOE6f2DNDpnigi-Hd5" \
            "1fCXpv3o-47TVo8ZHgANnInc1COZ5J8SB" \
            "1Mlv3j7HVGwM6o1PNUMJNdJghIpn_Lq_7" \
            "1RhfQs9kE3V1I9-WFBvMutWjXHPpt_IXM" \
            "1qjKx0Lnce2wgkO-gEH7K1QGycOSnWr6C" \
            "1G2riUqujLdJ1zOo2u1dROyGo9uIp6XjJ" \
            "1F0J14Fo4TnxmLYTLRVPn6jn3kZrg2JGW" \
            "1aOqqZNMtY4bSmJRnnIuMUC-dBu_LOzj0" \
            "1l4jUJkpW0fxrvjc36sxw2X21d5rVUcJy" \
            "1l-lZ1eZicwGNNMfVcOUEiXiDa11wEZ1S" \
            "1epetl5uiWZlkdUF9MMxVrASndM0mh6uH" \
            "1G5QZxDFMQSKVm2LZuhQBntdz-dWorObh" \
            "1GvZw6cDleOBKe_n-SvYXVk7UYTI6m9I8" \
            "1WbchLK87yc7IL8IUi8UEfNbKqCCupn9W" \
          )
          i=1
          for id in "${ids[@]}"; do
            n=$(printf '%02d' $i)
            echo "Downloading acc$n (id=$id)"
            curl -sSL "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" -o raw/$n
            echo "  raw size: $(stat -c%s raw/$n)"
            i=$((i+1))
          done
      - name: Convert and patch
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps
          import os
          os.makedirs('assets/acc', exist_ok=True)
          for i in range(1, 16):
              n = '%02d' % i
              im = Image.open(f'raw/{n}')
              im = ImageOps.exif_transpose(im)
              if im.mode in ('RGBA', 'P', 'LA'):
                  bg = Image.new('RGB', im.size, (255, 255, 255))
                  im = im.convert('RGBA')
                  bg.paste(im, mask=im.split()[-1])
                  im = bg
              else:
                  im = im.convert('RGB')
              im.thumbnail((1100, 1100), Image.LANCZOS)
              out = f'assets/acc/acc{n}.jpg'
              im.save(out, 'JPEG', quality=85, optimize=True)
              print(f'{out}: {os.path.getsize(out)} bytes, {im.size}')

          marker = '</div><!-- /grid -->'
          with open('index.html', encoding='utf-8') as f:
              html = f.read()
          if 'assets/acc/acc01.jpg' in html:
              print('index.html already patched; skipping')
          else:
              items = ''
              for i in range(1, 16):
                  n = '%02d' % i
                  items += (
                      f'<div class=\"wi fi vis\" data-cat=\"accessories\" data-src=\"assets/acc/acc{n}.jpg\" style=\"\" draggable=\"false\">\n'
                      f'      <img src=\"assets/acc/acc{n}.jpg\" alt=\"acc{n}\" loading=\"lazy\">\n'
                      f'      <div class=\"wio\"><div class=\"wt\" contenteditable=\"true\">Accessories</div><div class=\"wm\" contenteditable=\"true\">WWC Studio · Jewelry Design</div></div>\n'
                      f'      <button class=\"db\" onclick=\"di(this.parentElement)\">✕</button>\n'
                      f'    </div>\n'
                  )
              if marker not in html:
                  raise SystemExit('grid marker not found')
              html = html.replace(marker, items + marker)
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(html)
              print('Patched index.html with 15 accessory items')
          PY
      - name: Commit
        run: |
          rm -rf raw "$GITHUB_WORKSPACE/.github/workflows/import-accessories.yml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add 15 accessory images and gallery items" || { echo 'nothing to commit'; exit 0; }
          git push
