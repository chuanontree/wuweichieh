name: Apply Theme Changes
on:
  push:
    paths:
      - 'apply_changes.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/full-redesign-v1
          fetch-depth: 0
      - name: Apply theme changes
        run: python3 apply_changes.py
      - name: Cleanup and commit
        run: |
          rm -f apply_changes.py
          rm -rf _patch .github/workflows/apply-theme-patch.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add index.html
          git diff --cached --stat
          git commit -m "Add N/O themes (Chinese+Medieval), GSAP animations, 3D models, full-site CSS coverage" || echo "nothing to commit"
          git push
