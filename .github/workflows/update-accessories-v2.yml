name: Update accessories v2
on:
  push:
    paths:
      - '.github/workflows/update-accessories-v2.yml'
  workflow_dispatch: {}
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install deps
        run: pip install Pillow pillow-heif
      - name: Download images
        run: |
          set -e
          mkdir -p raw
          ids=(\
            "1Jiq9a0vXbTPryxCFoE4QWBGnjWH0vq8W" \
            "1KYuQADH6eOtwOXiGy2x_4wpPJkJ6VSEQ" \
            "1ftPYJlvcVhKH70eY6i4WKhNP9NMCFOAU" \
            "1h4TDZ36kWOg1N89ySdhgGBoG71f18ySm" \
            "1eVXhFhaPUpIx6kY5910yQB_UZgfrU6C4" \
            "1iTUmlzwxZw18lJG3txF7NpY4A321IkB9" \
            "1BRtCtmuK0MCs8DdWDeI2xVqhM7AjNBob" \
            "1Tf3W763byowuDNEGzafN0pNbNM2ZN2-q" \
            "1yhvA_TC7Krjmw83rUpUUHHhuNxbsKTRt" \
            "1i72M0k5y4BJKhVW5k2IliE1X3NkEeSfb" \
            "1VBXjyXhbYLm2bsNB6IcZ0_JvOtCVyQ4I" \
            "1Uwxm6KN-urahswaiSI43fni0nU1qt6ly" \
            "1cihUNrs0QjDIQBve7bynMrY8ylhewZ66" \
            "1Sz-9uR73gy3QkvA9qiko8UVkL2gjo_eS" \
            "10yJUdvkzeNsThPo4MXeGpNHz8vCsk-fq" \
            "1gDlNCS0atXQ9yI4j0pgtVdNsD75I9Ygz" \
          )
          i=1
          for id in "${ids[@]}"; do
            n=$(printf '%02d' $i)
            curl -sSL "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" -o raw/$n
            echo "acc$n raw: $(stat -c%s raw/$n)"
            i=$((i+1))
          done
      - name: Run update script
        run: |
          echo '' | base64 -d > acc_update.py
          python3 acc_update.py
      - name: Commit
        run: |
          rm -rf raw acc_update.py "$GITHUB_WORKSPACE/.github/workflows/update-accessories-v2.yml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          cat > /tmp/msg.txt <<'MSG'
Replace accessories gallery with 16 new images from Drive

Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01PjSSdQAsR63RawwDoYaZLV
MSG
          git commit -F /tmp/msg.txt || { echo 'nothing to commit'; exit 0; }
          git push
