name: Add CV 2026 placeholders
on:
  push:
    paths:
      - '.github/workflows/add-cv-2026.yml'
  workflow_dispatch: {}
jobs:
  edit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert CV rows
        run: |
          python3 - <<'PY'
          with open('index.html', encoding='utf-8') as f:
              html = f.read()
          anchor = '<div class="er"><span class="en">回返 設計聯展 (系統:不在此處)</span><span class="et">Exhibition · 桃園高中展藝中心 · 2026</span></div>'
          if anchor not in html:
              raise SystemExit('CV anchor not found')
          new_rows = (
              '\n        <div class="er"><span class="en">聯展（名稱待補）</span><span class="et">Group Show · 地點待補 · 2026</span></div>'
              '\n        <div class="er"><span class="en">聯展（名稱待補）</span><span class="et">Group Show · 地點待補 · 2026</span></div>'
          )
          if new_rows.strip() in html:
              print('placeholders already present; skipping')
          else:
              html = html.replace(anchor, anchor + new_rows)
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(html)
              print('Inserted two 2026 group-show placeholders')
          PY
      - name: Commit
        run: |
          rm -f "$GITHUB_WORKSPACE/.github/workflows/add-cv-2026.yml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add two 2026 group-show placeholders to CV" || { echo 'nothing to commit'; exit 0; }
          git push
