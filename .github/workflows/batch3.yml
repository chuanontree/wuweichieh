name: Batch3
on:
  push:
    paths:
      - 'batch3.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply deep batch 3
        run: python3 batch3.py
      - name: Commit and cleanup
        run: |
          rm -f batch3.py
          rm -f .github/workflows/batch3.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Deep batch 3: brutal/zen/sky about+cv layouts & interactions" || echo "nothing to commit"
          git push
