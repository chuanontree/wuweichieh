name: Apply theme splice
on:
  push:
    branches:
      - claude/zen-johnson-8hK29-v2
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Splice themes into index.html
        run: |
          python3 _theme_patch/splice.py
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git rm -rq _theme_patch
          git rm -q .github/workflows/apply-theme-splice.yml
          git add index.html
          git commit -m "Add 6 new themes: Infinite Canvas, Zen Focus, Isometric 3D, Multiverse, Apple Editorial, Cyberpunk Capsule" -m "https://claude.ai/code/session_01PjSSdQAsR63RawwDoYaZLV"
          git push
