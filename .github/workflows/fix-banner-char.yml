name: Fix banner char
on:
  push:
    paths:
      - '.github/workflows/fix-banner-char.yml'
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix char
        run: |
          python3 - <<'PY'
          with open('index.html', encoding='utf-8') as f:
              html = f.read()
          old = '<h1 class="hn">舌木<br><span class="ol">CHUANONTREE</span></h1>'
          new = '<h1 class="hn">舛木<br><span class="ol">CHUANONTREE</span></h1>'
          if old not in html:
              raise SystemExit('target not found')
          html = html.replace(old, new)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print('Fixed banner to 舛木')
          PY
      - name: Commit
        run: |
          rm -f "$GITHUB_WORKSPACE/.github/workflows/fix-banner-char.yml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix banner character to 舛木" || { echo 'nothing to commit'; exit 0; }
          git push
