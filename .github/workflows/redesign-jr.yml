name: Redesign JR
on:
  push:
    paths:
      - 'redesign_jr.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Redesign J-R layouts + 3D
        run: python3 redesign_jr.py
      - name: Commit and cleanup
        run: |
          rm -f redesign_jr.py
          rm -f .github/workflows/redesign-jr.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Redesign J-R with distinct layouts + 3D models for J-M" || echo "nothing to commit"
          git push
