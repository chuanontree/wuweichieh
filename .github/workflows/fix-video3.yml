name: Fix Video Text 3
on:
  push:
    paths:
      - 'fix_video3.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply fix
        run: python3 fix_video3.py
      - name: Commit and cleanup
        run: |
          rm -f fix_video3.py
          rm -f .github/workflows/fix-video3.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Fix: video description text and line separation" || echo "nothing to commit"
          git push
