name: Fix subtitle
on:
  push:
    paths:
      - '.github/workflows/fix-subtitle.yml'
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch subtitle
        run: |
          python3 - <<'PY'
          with open('index.html', encoding='utf-8') as f:
              html = f.read()
          old = '<span id="e0" contenteditable="false">新媒體藝術家 · New Media Artist</span>'
          new = '<span id="e0" contenteditable="false">武威桀 · New Media Artist</span>'
          if old not in html:
              raise SystemExit('subtitle span not found')
          html = html.replace(old, new)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print('Subtitle changed to 武威桀')
          PY
      - name: Commit
        run: |
          rm -f "$GITHUB_WORKSPACE/.github/workflows/fix-subtitle.yml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Change subtitle label to 武威桀" || { echo 'nothing to commit'; exit 0; }
          git push
