name: Fix Video Text 4
on:
  push:
    paths:
      - 'fix_video4.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply fix
        run: python3 fix_video4.py
      - name: Commit and cleanup
        run: |
          rm -f fix_video4.py
          rm -f .github/workflows/fix-video4.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Fix: add line break after 江育葳 in video description" || echo "nothing to commit"
          git push
