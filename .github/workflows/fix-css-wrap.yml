name: Fix CSS Wrapping
on:
  push:
    paths:
      - 'fix_css.py'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix CSS wrapping
        run: python3 fix_css.py
      - name: Commit and cleanup
        run: |
          rm -f fix_css.py
          rm -f .github/workflows/fix-css-wrap.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add index.html
          git diff --cached --stat
          git commit -m "Fix: wrap injected CSS in style tags" || echo "nothing to commit"
          git push
