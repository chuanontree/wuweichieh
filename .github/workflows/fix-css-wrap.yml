name: Restore index.html
on:
  push:
    paths:
      - 'RESTORE_TRIGGER'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore index.html from last good commit
        run: |
          git checkout e80ea23fd6a89afe0df395a6bc6f49a9e86bd5a3 -- index.html
      - name: Commit and cleanup
        run: |
          rm -f fix_css.py RESTORE_TRIGGER
          rm -f .github/workflows/fix-css-wrap.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Restore working index.html (revert broken theme apply)" || echo "nothing to commit"
          git push
