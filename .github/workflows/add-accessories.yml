name: Add Accessories
on:
  push:
    paths:
      - 'add_accessories.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply
        run: python3 add_accessories.py
      - name: Commit and cleanup
        run: |
          rm -f add_accessories.py
          rm -f .github/workflows/add-accessories.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Add accessories batch 1 (5 images)" || echo "nothing to commit"
          git push
