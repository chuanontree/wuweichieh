name: Batch2
on:
  push:
    paths:
      - 'batch2.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply deep batch 2
        run: python3 batch2.py
      - name: Commit and cleanup
        run: |
          rm -f batch2.py
          rm -f .github/workflows/batch2.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Deep batch 2: baroque/newspaper/medieval about+cv layouts & interactions" || echo "nothing to commit"
          git push
