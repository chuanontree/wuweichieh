name: Rename banner
on:
  push:
    paths:
      - '.github/workflows/rename-banner.yml'
  workflow_dispatch: {}
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch banner
        run: |
          python3 - <<'PY'
          with open('index.html', encoding='utf-8') as f:
              html = f.read()
          old = '<h1 class="hn">武威桀<br><span class="ol">WU WEI-CHIEH</span></h1>'
          new = '<h1 class="hn">舌木<br><span class="ol">CHUANONTREE</span></h1>'
          if old not in html:
              raise SystemExit('banner string not found')
          n = html.count(old)
          html = html.replace(old, new)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print(f'Replaced {n} banner occurrence(s)')
          PY
      - name: Commit
        run: |
          rm -f "$GITHUB_WORKSPACE/.github/workflows/rename-banner.yml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename banner title to 舛木 / CHUANONTREE" || { echo 'nothing to commit'; exit 0; }
          git push
