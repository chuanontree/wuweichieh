name: Fix Labels
on:
  push:
    paths:
      - 'fix_labels.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply
        run: python3 fix_labels.py
      - name: Commit and cleanup
        run: |
          rm -f fix_labels.py
          rm -f .github/workflows/fix-labels.yml
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git diff --cached --stat
          git commit -m "Remove letter prefix from theme dropdown labels" || echo "nothing to commit"
          git push
